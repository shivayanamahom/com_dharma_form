COM_DHARMAFORM_SETTING_UPLOAD_ALLOWED_DESC="Расширения файлов, которые можно загружать в формах, через запятую или по одному в строке. В каждом поле формы можно оставить только часть этого списка; пустой список у поля — всё из этого. Исполняемые и веб-файлы (php, html, js, svg, exe и т. п.) не принимаются никогда."
COM_DHARMAFORM_SETTING_RETENTION_DAYS_LABEL="Срок хранения заявок, дней"
COM_DHARMAFORM_SETTING_RETENTION_DAYS_DESC="По истечении срока заявка, её файлы и журнал доставки удаляются автоматически: раз в сутки при поступлении заявок, а также заданием планировщика, если оно создано (Система → Планировщик → Dharma Form). 0 — хранить бессрочно. Срок конкретной формы (вкладка «Защита») важнее этого."
COM_DHARMAFORM_SETTING_RETENTION_SPAM_LABEL="Срок хранения спама, дней"
COM_DHARMAFORM_SETTING_RETENTION_SPAM_DESC="Заявки, помеченные защитой как спам, хранятся не дольше этого срока. 0 — как остальные заявки."
COM_DHARMAFORM_SETTING_COLLECT_TITLE="Данные о посетителе"
COM_DHARMAFORM_SETTING_COLLECT_NOTE="Что дополнительно сохранять вместе с заявкой. По умолчанию ничего не сохраняется. Это персональные данные: если включаете, укажите это в политике конфиденциальности. Данные удаляются вместе с заявкой по сроку хранения."
COM_DHARMAFORM_SETTING_COLLECT_IP_LABEL="IP-адрес"
COM_DHARMAFORM_SETTING_COLLECT_IP_DESC="Для ограничения частоты адрес всегда хранится только в виде необратимого хеша. Этот переключатель сохраняет сам адрес."
COM_DHARMAFORM_SETTING_COLLECT_BROWSER_LABEL="Браузер, система и устройство"
COM_DHARMAFORM_SETTING_COLLECT_BROWSER_DESC="Например: Chrome 120, Windows 10/11, компьютер. Определяется по заголовку запроса."
COM_DHARMAFORM_SETTING_COLLECT_LANG_LABEL="Язык браузера"
COM_DHARMAFORM_SETTING_COLLECT_LANG_DESC="Например: ru-RU."
COM_DHARMAFORM_SETTING_COLLECT_REF_LABEL="Откуда пришёл"
COM_DHARMAFORM_SETTING_COLLECT_REF_DESC="Страница, с которой посетитель перешёл на сайт (реферер браузера), если браузер её сообщает."
COM_DHARMAFORM_SETTING_COLLECT_SCREEN_LABEL="Экран и часовой пояс"
COM_DHARMAFORM_SETTING_COLLECT_SCREEN_DESC="Размер экрана и часовой пояс посетителя, сообщает скрипт формы."
COM_DHARMAFORM_SETTING_NOTIFY_META_LABEL="Показывать в уведомлениях"
COM_DHARMAFORM_SETTING_NOTIFY_META_DESC="Добавлять собранные данные в письма и сообщения мессенджеров."
COM_DHARMAFORM_META_IP="IP-адрес"
COM_DHARMAFORM_META_BROWSER="Браузер"
COM_DHARMAFORM_META_OS="Система"
COM_DHARMAFORM_META_DEVICE="Устройство"
COM_DHARMAFORM_META_LANG="Язык браузера"
COM_DHARMAFORM_META_REF="Пришёл со страницы"
COM_DHARMAFORM_META_SCREEN="Экран"
COM_DHARMAFORM_META_TZ="Часовой пояс"
COM_DHARMAFORM_META_DEVICE_DESKTOP="компьютер"
COM_DHARMAFORM_META_DEVICE_MOBILE="телефон"
COM_DHARMAFORM_META_DEVICE_TABLET="планшет"
COM_DHARMAFORM_CSV_VISITOR="Данные посетителя"
COM_DHARMAFORM_FORM_GROUP_CONTEXT="Товар из каталога"
COM_DHARMAFORM_FORM_CONTEXT_NOTE="Поставьте на кнопку «Быстрый заказ» в карточке или на странице товара класс этой формы. Включите переключатель ниже — форма сама узнает товар."
COM_DHARMAFORM_FORM_CONTEXT_DHARMASHOP_LABEL="Подцеплять товар Dharma Shop"
COM_DHARMAFORM_FORM_CONTEXT_DHARMASHOP_DESC="Форма покажет товар, с кнопки которого открыта (картинка, название, цена), а в заявку и уведомления попадут название, артикул, цена и ссылка на товар. Товар определяется по карточке, в которой стоит кнопка, или по странице товара, а данные берутся из базы магазина, не из запроса."
COM_DHARMAFORM_FORM_TAB_INTEGRATIONS="Интеграции"
COM_DHARMAFORM_FORM_INTEGRATIONS_NONE="Поддерживаемые компоненты не найдены. Интеграции доступны для Dharma Shop: после его установки здесь появится переключатель."
COM_DHARMAFORM_SETTING_IP_SOURCE_LABEL="Откуда брать адрес посетителя"
COM_DHARMAFORM_SETTING_IP_SOURCE_DESC="Адрес нужен для ограничения частоты и защиты. По умолчанию берётся адрес соединения. Если сайт стоит за прокси или CDN (например, Cloudflare), все посетители выглядят одним адресом прокси: выберите заголовок, который ставит именно ваш прокси. Не выбирайте заголовок, если прокси его не ставит: посетитель сможет подделать адрес и обойти ограничения."
COM_DHARMAFORM_SETTING_IP_SOURCE_REMOTE="Адрес соединения (по умолчанию, безопасно)"
COM_DHARMAFORM_SETTING_IP_SOURCE_CF="Cloudflare (CF-Connecting-IP)"
COM_DHARMAFORM_SETTING_IP_SOURCE_REAL="X-Real-IP (nginx)"
COM_DHARMAFORM_SETTING_IP_SOURCE_XFF="X-Forwarded-For (первый адрес)"
COM_DHARMAFORM_SETTING_SITE_URL_LABEL="Адрес сайта для уведомлений"
COM_DHARMAFORM_SETTING_SITE_URL_DESC="Основа ссылок «Открыть в админке» и ссылок на товар в письмах и сообщениях мессенджеров. Берётся не из запроса (посетитель может подделать адрес сайта), поэтому укажите настоящий адрес. Пусто — адрес из конфигурации Joomla (live_site) или тот, с которого вы первый раз открыли компонент в админке."
COM_DHARMAFORM_SPAM_REASON_RATE="Слишком много заявок с адреса"
COM_DHARMAFORM_FORM_AUTO_SENT_LABEL="Не показывать после отправки, дней"
COM_DHARMAFORM_FORM_AUTO_SENT_DESC="Кто уже отправил эту форму, автоокно не увидит столько дней. 0 — показывать независимо от отправки. Для проверки на себе откройте сайт в режиме инкогнито или добавьте к адресу ?dform=reset."
COM_DHARMAFORM_SETTING_DEV_MODE_LABEL="Режим разработчика"
COM_DHARMAFORM_SETTING_DEV_MODE_DESC="Автопоказ окон без ограничений: окно открывается при каждой загрузке страницы, даже если его уже закрывали или форму уже отправляли («раз за сеанс», «раз в N дней», «не показывать после отправки» не действуют). Нужен, чтобы проверять настройки автопоказа. Выключите на рабочем сайте."
COM_DHARMAFORM_FIELD_LABEL_MODE_LABEL="Подпись над полем"
COM_DHARMAFORM_FIELD_LABEL_MODE_DESC="Показывать ли подпись над этим полем или только подсказку внутри него. По умолчанию — как задано для всей формы. Если подсказка не задана, в ней показывается подпись."
COM_DHARMAFORM_LABEL_MODE_FORM="Как в настройке формы"
COM_DHARMAFORM_LABEL_MODE_SHOW="Показывать подпись над полем"
COM_DHARMAFORM_LABEL_MODE_HIDE="Только подсказка внутри поля"
COM_DHARMAFORM_SETTING_INLINE_REFRESH_LABEL="Обновлять токен у форм на странице"
COM_DHARMAFORM_SETTING_INLINE_REFRESH_DESC="Форма, выведенная на странице, при загрузке запрашивает свежие токен и метку: страница могла попасть в кэш (кэш Joomla, CDN), а токен привязан к посетителю. Это один лишний лёгкий запрос на страницу. «Авто» — только если на сайте включён кэш Joomla или кэш страниц; если страницы кэширует CDN или прокси, выберите «Всегда»."
COM_DHARMAFORM_SETTING_INLINE_REFRESH_AUTO="Авто (если включён кэш Joomla)"
COM_DHARMAFORM_SETTING_INLINE_REFRESH_ALWAYS="Всегда"
COM_DHARMAFORM_SETTING_INLINE_REFRESH_NEVER="Никогда"
