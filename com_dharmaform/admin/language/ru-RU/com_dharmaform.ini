COM_DHARMAFORM_FORM_PROTECT_SCORE_LIMIT_DESC="Заявка набирает баллы за подозрительные признаки; порог — когда считать спамом. От 1 до 20: чем меньше, тем строже защита. Заявка-спам не теряется: она сохраняется с пометкой и причинами."
