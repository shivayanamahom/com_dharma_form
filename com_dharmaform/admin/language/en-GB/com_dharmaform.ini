COM_DHARMAFORM_FORM_GROUP_CONTEXT="Catalog product"
COM_DHARMAFORM_FORM_CONTEXT_NOTE="Put this form class on the Quick order button in a product card or on the product page. Turn on the switch below and the form will find the product on its own."
COM_DHARMAFORM_FORM_CONTEXT_DHARMASHOP_LABEL="Attach a Dharma Shop product"
COM_DHARMAFORM_FORM_CONTEXT_DHARMASHOP_DESC="The form shows the product whose button opened it (image, name, price), and the submission and notifications get the name, SKU, price and product link. The product is found by the card that holds the button or by the product page, and the data comes from the shop database, not from the request."
COM_DHARMAFORM_FORM_TAB_INTEGRATIONS="Integrations"
COM_DHARMAFORM_FORM_INTEGRATIONS_NONE="No supported components found. Integrations are available for Dharma Shop: once it is installed, the switch appears here."
COM_DHARMAFORM_SETTING_IP_SOURCE_LABEL="Where to take the visitor address from"
COM_DHARMAFORM_SETTING_IP_SOURCE_DESC="The address is used for rate limiting and protection. By default the connection address is used. If the site is behind a proxy or CDN (for example Cloudflare), all visitors look like one proxy address: choose the header that your proxy sets. Do not choose a header the proxy does not set: a visitor could forge the address and bypass the limits."
COM_DHARMAFORM_SETTING_IP_SOURCE_REMOTE="Connection address (default, safe)"
COM_DHARMAFORM_SETTING_IP_SOURCE_CF="Cloudflare (CF-Connecting-IP)"
COM_DHARMAFORM_SETTING_IP_SOURCE_REAL="X-Real-IP (nginx)"
COM_DHARMAFORM_SETTING_IP_SOURCE_XFF="X-Forwarded-For (first address)"
COM_DHARMAFORM_SETTING_SITE_URL_LABEL="Site address for notifications"
COM_DHARMAFORM_SETTING_SITE_URL_DESC="The base of the Open in admin links and product links in emails and messenger messages. It is not taken from the request (a visitor can forge the site address), so enter the real address. Empty — the address from the Joomla configuration (live_site) or the one you first opened the component from in the admin."
COM_DHARMAFORM_SPAM_REASON_RATE="Too many submissions from the address"
COM_DHARMAFORM_FORM_AUTO_SENT_LABEL="Hide after submission, days"
COM_DHARMAFORM_FORM_AUTO_SENT_DESC="Whoever has already submitted this form will not see the auto window for this many days. 0 — show regardless of submission. To test on yourself, open the site in a private window or add ?dform=reset to the address."
COM_DHARMAFORM_SETTING_DEV_MODE_LABEL="Developer mode"
COM_DHARMAFORM_SETTING_DEV_MODE_DESC="Auto-popup without limits: the window opens on every page load, even if it was already closed or the form was submitted (once per session, once in N days and hide after submission do not apply). Use it to check the auto-popup settings. Turn it off on the live site."
COM_DHARMAFORM_FIELD_LABEL_MODE_LABEL="Label above the field"
COM_DHARMAFORM_FIELD_LABEL_MODE_DESC="Whether to show the label above this field or only the placeholder inside it. By default as set for the whole form. If no placeholder is set, the label is shown in it."
COM_DHARMAFORM_LABEL_MODE_FORM="As in the form setting"
COM_DHARMAFORM_LABEL_MODE_SHOW="Show the label above the field"
COM_DHARMAFORM_LABEL_MODE_HIDE="Placeholder inside the field only"
COM_DHARMAFORM_SETTING_INLINE_REFRESH_LABEL="Refresh the token of forms on the page"
COM_DHARMAFORM_SETTING_INLINE_REFRESH_DESC="A form printed on the page asks for a fresh token and stamp on load: the page may have been cached (Joomla cache, CDN) while the token is tied to the visitor. It is one extra light request per page. Auto — only if Joomla cache or page cache is enabled; if a CDN or proxy caches pages, choose Always."
COM_DHARMAFORM_SETTING_INLINE_REFRESH_AUTO="Auto (if Joomla cache is on)"
COM_DHARMAFORM_SETTING_INLINE_REFRESH_ALWAYS="Always"
COM_DHARMAFORM_SETTING_INLINE_REFRESH_NEVER="Never"
