COM_DHARMAFORM_FORM_GROUP_PROTECT_SCORE="Spam threshold"
COM_DHARMAFORM_FORM_GROUP_RETENTION="Storage"
COM_DHARMAFORM_FORM_PROTECT_SCORE_NOTE="A submission scores points for suspicious signs; the threshold is when to treat it as spam. Instant signs (a filled honeypot, a forged timestamp) are treated as spam at once."
COM_DHARMAFORM_FORM_PROTECT_FLOOD_LIMIT_LABEL="Submissions per hour for the whole form"
COM_DHARMAFORM_FORM_PROTECT_FLOOD_LIMIT_DESC="If more submissions arrive within an hour, the next ones score points for a «flood» (an attack from many addresses). 0 — no check; up to 1000."
COM_DHARMAFORM_FORM_PROTECT_POW_LABEL="Browser proof-of-work"
COM_DHARMAFORM_FORM_PROTECT_POW_DESC="The visitor browser solves a small puzzle before sending: a human does not notice, but it is costly for bulk bots."
COM_DHARMAFORM_FORM_PROTECT_POW_BITS_LABEL="Puzzle difficulty, bits"
COM_DHARMAFORM_FORM_PROTECT_POW_BITS_DESC="From 8 to 20. Each extra bit doubles the work: 14 is a fraction of a second on a phone, 20 is a noticeable pause."
COM_DHARMAFORM_FORM_PROTECT_BEHAVIOR_LABEL="Human behaviour signs"
COM_DHARMAFORM_FORM_PROTECT_BEHAVIOR_DESC="A form without a single mouse move, touch or key press scores points."
COM_DHARMAFORM_FORM_PROTECT_REPLAY_LABEL="Replay protection"
COM_DHARMAFORM_FORM_PROTECT_REPLAY_DESC="One displayed form is accepted once; a repeat of the same request scores points."
COM_DHARMAFORM_FORM_PROTECT_SCRIPTS_LABEL="Hieroglyphs and unusual scripts"
COM_DHARMAFORM_FORM_PROTECT_SCRIPTS_DESC="Chinese, Japanese, Korean, Arabic, Hebrew, Thai and Devanagari in field values score points. Turn it off if you accept submissions in these languages."
COM_DHARMAFORM_FORM_PROTECT_GIBBERISH_LABEL="Gibberish text"
COM_DHARMAFORM_FORM_PROTECT_GIBBERISH_DESC="Texts like «asdfghjkl» or without vowels score points."
COM_DHARMAFORM_FORM_PROTECT_DISPOSABLE_LABEL="Disposable email"
COM_DHARMAFORM_FORM_PROTECT_DISPOSABLE_DESC="Addresses of temporary mail services score points. Add your own domains in the component options."
COM_DHARMAFORM_FORM_PROTECT_MX_LABEL="Check the domain mail server"
COM_DHARMAFORM_FORM_PROTECT_MX_DESC="The email domain must have an MX record. The DNS query adds a delay to sending, so it is off by default."
COM_DHARMAFORM_FORM_PROTECT_SCORE_LIMIT_LABEL="Spam threshold, points"
COM_DHARMAFORM_FORM_PROTECT_SCORE_LIMIT_DESC="A submission scores points for suspicious signs; the threshold is when to treat it as spam. From 1 to 20: the lower, the stricter. A spam submission is not lost: it is saved with a flag and the reasons."
COM_DHARMAFORM_CONFIG_SPAM="Spam protection"
COM_DHARMAFORM_CONFIG_SPAM_DESC="Common lists for all forms. Per-form checks are set on its «Protection and storage» tab."
COM_DHARMAFORM_SETTING_SPAM_IP_WHITELIST_LABEL="Trusted addresses"
COM_DHARMAFORM_SETTING_SPAM_IP_WHITELIST_DESC="One IP address or network (CIDR) per line. Submissions from these addresses skip the protection (for example, your office)."
COM_DHARMAFORM_SETTING_SPAM_IP_BLACKLIST_LABEL="Blocked addresses"
COM_DHARMAFORM_SETTING_SPAM_IP_BLACKLIST_DESC="One IP address or network (CIDR) per line. Submissions from these addresses are saved as spam."
COM_DHARMAFORM_SETTING_SPAM_STOPWORDS_LABEL="Common stop words"
COM_DHARMAFORM_SETTING_SPAM_STOPWORDS_DESC="One word or phrase per line; apply to all forms together with the form own stop words."
COM_DHARMAFORM_SETTING_SPAM_DISPOSABLE_EXTRA_LABEL="Extra disposable email domains"
COM_DHARMAFORM_SETTING_SPAM_DISPOSABLE_EXTRA_DESC="One domain per line; added to the built-in list."
