COM_DHARMAFORM_FORM_DISPLAY_POPUP="Popup (in a window)"
COM_DHARMAFORM_FORM_DISPLAY_INLINE="Regular (on the page)"
COM_DHARMAFORM_FORM_AUTO_INLINE_NOTE="Auto-show is available for popup forms only: choose that type in the right panel."
