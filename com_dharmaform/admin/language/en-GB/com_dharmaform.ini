COM_DHARMAFORM_SETTING_UPLOAD_ALLOWED_LABEL="Allowed file types"
COM_DHARMAFORM_SETTING_UPLOAD_ALLOWED_DESC="File extensions that may be uploaded in forms, comma separated or one per line. Each form field may keep only a part of this list; an empty list in a field means everything from here. Executable and web files (php, html, js, svg, exe, etc.) are never accepted."
COM_DHARMAFORM_SETTING_RETENTION_DAYS_LABEL="Submission retention, days"
COM_DHARMAFORM_SETTING_RETENTION_DAYS_DESC="When the period ends, the submission, its files and delivery log are deleted automatically: once a day when submissions arrive, and by a scheduler task if you created one (System → Scheduler → Dharma Form). 0 — keep forever. A form-specific period (the Protection tab) takes priority."
COM_DHARMAFORM_SETTING_RETENTION_SPAM_LABEL="Spam retention, days"
COM_DHARMAFORM_SETTING_RETENTION_SPAM_DESC="Submissions marked as spam are kept no longer than this. 0 — same as other submissions."
COM_DHARMAFORM_SETTING_COLLECT_TITLE="Visitor data"
COM_DHARMAFORM_SETTING_COLLECT_NOTE="What else to store with a submission. Nothing is stored by default. This is personal data: if you enable it, mention it in your privacy policy. The data is deleted with the submission when its retention ends."
COM_DHARMAFORM_SETTING_COLLECT_IP_LABEL="IP address"
COM_DHARMAFORM_SETTING_COLLECT_IP_DESC="For rate limiting the address is always stored only as an irreversible hash. This switch stores the address itself."
COM_DHARMAFORM_SETTING_COLLECT_BROWSER_LABEL="Browser, system and device"
COM_DHARMAFORM_SETTING_COLLECT_BROWSER_DESC="For example: Chrome 120, Windows 10/11, desktop. Taken from the request header."
COM_DHARMAFORM_SETTING_COLLECT_LANG_LABEL="Browser language"
COM_DHARMAFORM_SETTING_COLLECT_LANG_DESC="For example: ru-RU."
COM_DHARMAFORM_SETTING_COLLECT_REF_LABEL="Where the visitor came from"
COM_DHARMAFORM_SETTING_COLLECT_REF_DESC="The page the visitor came to the site from (the browser referrer), if the browser reports it."
COM_DHARMAFORM_SETTING_COLLECT_SCREEN_LABEL="Screen and time zone"
COM_DHARMAFORM_SETTING_COLLECT_SCREEN_DESC="The visitor screen size and time zone, reported by the form script."
COM_DHARMAFORM_SETTING_NOTIFY_META_LABEL="Show in notifications"
COM_DHARMAFORM_SETTING_NOTIFY_META_DESC="Add the collected data to emails and messenger messages."
