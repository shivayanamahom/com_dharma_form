PLG_TASK_DHARMAFORM="Task — Dharma Form"
PLG_TASK_DHARMAFORM_DESCRIPTION="Joomla Scheduler tasks for the forms component: retry failed notifications and purge submissions by retention period."
PLG_TASK_DHARMAFORM_NOTIFY_RETRY_TITLE="Forms: retry notifications"
PLG_TASK_DHARMAFORM_NOTIFY_RETRY_DESC="Retries submission notifications that failed (email, Telegram or MAX error) or were interrupted; up to five attempts with an increasing pause. Recommended every 10 minutes."
PLG_TASK_DHARMAFORM_SUBMISSIONS_PURGE_TITLE="Forms: purge submissions"
PLG_TASK_DHARMAFORM_SUBMISSIONS_PURGE_DESC="Deletes submissions whose retention period has expired (form setting, Protection tab) together with uploaded files and the delivery log. Recommended once a day at night."
