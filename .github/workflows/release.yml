name: Build and publish Joomla update

# Запускается вручную (Actions → Run workflow): релиз оформляется только по команде.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: joomla-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Build release when the package version is new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pkg_dharma_form.xml | head -1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid package version: $version" >&2; exit 1; }
          tag="v$version"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi

          bash build.sh
          package="dist/pkg_dharma_form-${version}.zip"
          test -f "$package"
          checksum="$(sha256sum "$package" | cut -d' ' -f1)"
          python3 - "$version" "$checksum" "$package" "$GH_REPO" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          version, checksum, package, repo = sys.argv[1:]
          tree = ET.parse("updates.xml")
          root = tree.getroot()

          for old in list(root):
              if old.findtext("version") == version:
                  root.remove(old)

          update = ET.Element("update")
          root.insert(0, update)

          for tag, value in (
              ("name", "Dharma Form"),
              ("description", "Dharma Form — универсальные формы для Joomla 5.2+ и 6+"),
              ("element", "pkg_dharmaform"),
              ("type", "package"),
              ("version", version),
          ):
              ET.SubElement(update, tag).text = value

          ET.SubElement(update, "infourl", {"title": f"Dharma Form v{version}"}).text = f"https://github.com/{repo}/releases/tag/v{version}"
          downloads = ET.SubElement(update, "downloads")
          ET.SubElement(downloads, "downloadurl", {"type": "full", "format": "zip"}).text = f"https://github.com/{repo}/releases/download/v{version}/{package.rsplit('/', 1)[-1]}"
          ET.SubElement(update, "sha256").text = checksum
          ET.SubElement(update, "maintainer").text = "Dharma Design"
          ET.SubElement(update, "maintainerurl").text = "https://github.com/shivayanamahom"
          ET.SubElement(update, "targetplatform", {"name": "joomla", "version": "((5|6)\\..*)"})

          ET.indent(root, space="\t")
          tree.write("updates.xml", encoding="utf-8", xml_declaration=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.xml
          if ! git diff --cached --quiet; then
            git commit -m "Publish Joomla update metadata for $tag"
            git push origin HEAD:main
          fi
          gh release create "$tag" "$package" --title "Dharma Form $version" --generate-notes
